name: Eval Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
      - name: Run eval runner
        env:
          CANDIDATE_AGENT_BASE_URL: ${{ secrets.CANDIDATE_AGENT_BASE_URL }}
          CANDIDATE_AGENT_API_KEY: ${{ secrets.CANDIDATE_AGENT_API_KEY }}
          CANDIDATE_AGENT_TIMEOUT_SECONDS: 60
        run: python evals/run_eval.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts
          path: evals/output
